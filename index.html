<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1923">
<title>ファームまじでValley</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tactical-ui.css?v=20261013-grounded-items">
<link rel="icon" type="image/svg+xml" href="assets/ui/tactical/cargo.svg">
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud">
  <div class="hud-left">
    <div id="medal" class="medal">
      <img class="medal-art" src="assets/ui/tactical/medal-illustrated.png" alt="">
      <div class="medal-copy"><span class="medal-label">LV</span><span id="level-num">1</span></div>
    </div>
    <div class="xp-wrap">
      <div class="xp-bar"><div id="xp-fill" class="xp-fill"></div></div>
      <div id="xp-text" class="xp-text">0/0</div>
    </div>
  </div>
  <div class="hud-right">
    <div class="hud-row">
      <div id="coin-pill" class="pill">
        <img src="assets/ref/tactical_coin.png" alt="コイン">
        <span id="coin-num">0</span>
      </div>
      <div id="gem-pill" class="pill">
        <img src="assets/ref/tactical_gem.png" alt="ジェム">
        <span id="gem-num">0</span><button id="gem-add" class="resource-add" aria-label="ジェムの市場を開く">＋</button>
      </div>
    </div>
    <div id="energy-pill" class="pill small">
      <img src="assets/ref/tactical_bolt.png" alt="エネルギー">
      <span id="energy-num">50</span><small>/50</small>
      <em id="energy-timer"></em><button id="energy-add" class="resource-add" aria-label="スタミナの市場を開く">＋</button>
    </div>
  </div>
</div>

<div id="side">
  <button id="btn-reset" class="round-btn" aria-label="最初から">⟲</button>
</div>

<div id="regrow" class="regrow hidden">
  <div id="rg-title" class="rg-head">回復中</div>
  <p id="rg-growth" class="rg-growth hidden"></p>
  <div class="rg-time"><img src="assets/ref/tactical_clock.png" alt=""><b id="rg-time">0M 0S</b></div>
  <button id="rg-skip" class="rg-skip"><img src="assets/ref/tactical_gem.png" alt="ジェム"><b id="rg-cost">0</b><span>即完了</span></button>
</div>

<button id="worker-chip" class="worker-btn" aria-label="作業者"><img src="assets/ref/tactical_hardhat.png" alt=""><span id="worker-text">0/1</span></button>

<div id="farm-tools" class="farm-tools">
  <button id="btn-market" class="farm-tool" aria-label="市場を開く" aria-controls="market"><img src="assets/ref/market/market.png" alt=""><span>市場</span><b id="market-badge" class="tool-badge">!</b></button>
  <button id="shovel-btn" class="farm-tool" aria-label="シャベルをアイテムへドラッグして消す" title="アイテムへドラッグして消す"><img src="assets/ref/tactical_shovel.png" alt="シャベル" draggable="false"><span>シャベル</span></button>
</div>
<div id="shovel-cursor" class="shovel-cursor hidden" aria-hidden="true"><img src="assets/ref/tactical_shovel.png" alt="" draggable="false"><span>アイテムに重ねて離す</span></div>

<div id="workers" class="workers hidden">
  <h2 id="wk-title">作業者が足りません!</h2>
  <div class="wk-face"><img src="assets/ref/tactical_foreman.png" alt=""></div>
  <div class="wk-count" id="wk-count">0/1</div>
  <p class="wk-msg">14日間、作業者をもう1人借りよう!</p>
  <button id="wk-rent" class="wk-price"><img src="assets/ref/tactical_gem.png" alt=""><b id="wk-gems">225</b></button>
  <button id="wk-close" class="wk-later">今はやめる</button>
  <p class="wk-note" id="wk-note"></p>
</div>

<div id="tutor" class="tutor">
  <div class="tutor-bubble"><span id="tutor-text"></span></div>
  <img class="tutor-face" src="assets/ref/tactical_francine.png" alt="">
</div>

<div id="bottom">
  <div class="crate-wrap">
    <button id="crate-btn" class="crate-btn" aria-label="箱を開ける">
      <img class="crate-art" src="assets/ui/tactical/cargo-illustrated.png" alt="">
      <span class="crate-action">箱を開ける</span>
    </button>
    <div class="crate-label"><b id="crate-count">0/40</b><span id="crate-regen" class="crate-regen"><i>+5 :</i><em id="crate-timer"></em></span></div>
    <img id="hand" class="hand" src="assets/ref/tactical_hand.png" alt="">
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="chest" class="chest-popup hidden" role="dialog" aria-labelledby="chest-title">
  <button id="chest-close" class="chest-close" aria-label="閉じる">×</button>
  <div id="chest-title" class="chest-title">宝箱</div>
  <div class="chest-time"><img src="assets/ref/tactical_clock.png" alt="残り時間"><b id="chest-time"></b></div>
  <div class="chest-key"><img id="chest-key" src="assets/ref/items/tactical_keys_0.png" alt="カギ"><b id="chest-count">0/2</b></div>
  <button id="chest-open" class="chest-open">開ける</button>
</div>

<div id="panel" class="overlay hidden">
  <div class="card ord-card">
    <div class="ord-head">
      <img class="ord-ico" src="assets/ref/tactical_orders.png" alt="">
      <span id="ord-title">オーダー</span>
      <button id="panel-close" class="card-close" aria-label="閉じる">×</button>
    </div>
    <div id="ord-tabs" class="ord-tabs"><button id="tab-order" class="on">オーダー</button><button id="tab-stock">素材</button></div>
    <div id="panel-body" class="ord-body"></div>
  </div>
</div>

<div id="card-popover" class="card-popover hidden" role="dialog" aria-label="盤面アイテムの情報">
  <button id="card-close" aria-label="情報を閉じる">×</button>
  <h2 id="card-title"></h2><p id="card-status"></p><p id="card-effect"></p>
  <button id="card-use">強化する</button><p id="card-help"></p>
</div>

<div id="levelup" class="levelup hidden">
  <div class="lu-medal"><img class="medal-art" src="assets/ui/tactical/medal-illustrated.png" alt=""><b id="lu-level">2</b></div>
  <h2>レベルアップ!</h2>
  <p id="lu-sub" class="lu-sub">報酬</p>
  <div id="lu-list" class="lu-list"></div>
  <p class="lu-tap">タップして続ける</p>
</div>

<div id="market" class="market-overlay hidden">
  <div id="market-dialog" class="market-dialog" role="dialog" aria-modal="true" aria-labelledby="market-title">
    <header class="market-header"><div><small>VALLEY / SUPPLY STATION</small><h1 id="market-title">市場</h1></div><button id="market-close" aria-label="市場を閉じる">×</button></header>
    <div class="market-wallet"><span><img src="assets/ref/tactical_coin.png" alt="コイン"><b id="market-coin-balance">0</b></span><span><img src="assets/ref/tactical_gem.png" alt="ジェム"><b id="market-gem-balance">0</b></span></div>
    <nav id="market-tabs" aria-label="市場の商品カテゴリ"><button data-section="deals">特売</button><button data-section="crates">物資箱</button><button data-section="energy">スタミナ</button><button data-section="gems">ジェム</button></nav>
    <div id="market-scroll" class="market-scroll"><div id="market-content"></div></div>
    <p id="market-message" class="market-message hidden" role="status"></p>
    <footer class="market-footer">無料パックは24時間ごとに受け取り可能</footer>
    <div id="market-confirm" class="market-confirm hidden" role="alertdialog" aria-modal="true" aria-labelledby="market-confirm-title" aria-describedby="market-confirm-copy"><div><h2 id="market-confirm-title"></h2><p id="market-confirm-copy"></p><button id="market-confirm-ok"></button><button id="market-confirm-cancel">キャンセル</button></div></div>
  </div>
</div>

<div id="loading" class="loading">
  <div class="loading-brand"><span>FARM</span><strong>まじでValley</strong><i>MERGE &amp; BUILD</i></div>
  <div class="loading-box">
    <div class="loading-bar"><div id="loading-fill"></div></div>
    <div id="loading-text">読み込み中…</div>
  </div>
</div>

<script src="js/layout.js"></script>
<script src="js/data.js?v=20261013-grounded-items"></script>
<script src="js/engine.js?v=20261013-card-rate-6"></script>
<script src="js/fx.js"></script>
<script src="js/view.js?v=20261013-bottom-stars"></script>
<script src="js/market.js?v=20261013-grounded-items"></script>
<script src="js/main.js?v=20261013-grounded-items"></script>
</body>
</html>
