<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13252a"><title>週末玉転がし｜3D確認用</title><link rel="stylesheet" href="style.css?v=3d2"></head>
<body>
<main class="cinema" aria-label="週末玉転がしの確認映像">
 <section class="stage" id="stage" aria-label="3Dレース映像">
  <canvas id="race" aria-label="玉転がしレース"></canvas>
  <div class="film-brand"><span class="brand-mark">K/</span><div>MARBLE HARVEST<small>WEEKEND RACE · PREVIEW</small></div></div>
  <div class="scene-caption" id="sceneCaption"><span>01</span><div>THE MARBLE GARDEN<small>ピンの庭</small></div></div>
  <div class="countdown" id="countdown" aria-hidden="true"></div>
  <div class="end-title" id="endTitle" hidden><small>FINISH</small><strong id="winner"></strong><span>1st place</span></div>
  <div class="start-screen" id="startScreen"><div class="start-card"><p class="eyebrow">K/AYO RANCH · WEEKEND RACE</p><h1>MARBLE<br><em>HARVEST</em></h1><p class="intro">転がる先は、運まかせ。</p><button id="watch" disabled>映像を準備中…</button><p class="preview-note">確認用映像 · 参加者の名前は仮です</p><p id="error" role="alert"></p></div></div>
 </section>
 <aside class="standings" aria-label="走行中の順位"><header><span class="live-dot"></span><span id="rankingLabel">RANKING</span><small>順位 / 玉 / 名前</small></header><ol id="rankings"></ol><footer>12 MARBLES<br><span>同じ記録を再生します</span></footer></aside>
</main>
<script src="weekly-race-state.js?v=20261016-race"></script><script src="weekly-race-replay.js?v=20261016-race"></script>
<section id="preview-result" class="preview-result" hidden><div class="preview-result-card"><small>ころころレース結果 · 確認用</small><h2 id="preview-congrats"></h2><p>日曜日を過ぎると報酬は受け取れません</p><div id="preview-prizes"></div><button id="preview-claim">報酬を受け取る</button><p id="preview-claim-note">確認用のため、実際の持ち物には加算されません。</p><ol id="preview-final-ranks"></ol></div></section>
<script type="module" src="replay-3d.js?v=3d3"></script>
</body></html>
