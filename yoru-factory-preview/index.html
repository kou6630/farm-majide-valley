<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14202c">
  <title>ヨルの工場 — フィールド確認</title>
  <link rel="icon" type="image/png" href="./assets/floor-light.png">
  <script type="module" crossorigin src="./assets/index-Dxez3fpW.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Dogcb2Tr.css">
</head>
<body>
  <main id="app">
    <section id="playfield" aria-label="工場フィールド"><div id="game"></div></section>
    <header id="field-header">
      <div class="title"><small>YORU'S FACTORY</small><h1>ヨルの工場</h1></div>
      <nav class="camera-tools" aria-label="視点の操作">
        <button id="rotate-left" aria-label="左へ90度回転">↶<small>90°</small></button>
        <span id="direction" role="status" aria-live="polite">0° · 北の壁</span>
        <button id="rotate-right" aria-label="右へ90度回転">↷<small>90°</small></button>
        <button id="zoom-out" class="zoom-start" aria-label="縮小">−</button>
        <button id="zoom-in" aria-label="拡大">＋</button>
      </nav>
    </header>
    <div id="edit-toolbar"><p id="edit-hint" role="status" aria-live="polite" hidden></p><button id="edit-toggle" aria-pressed="false">エディットモード</button></div>
    <footer id="field-footer"><span id="field-size"></span><span id="outlet-summary">排出口 / まな板台 1×2</span></footer>
  </main>
  <dialog id="source-dialog" aria-labelledby="source-title">
    <header class="source-heading"><div><small>排出口の設定</small><h2 id="source-title">ケイオー牧場の持ち物</h2></div><button id="source-close" aria-label="閉じる">×</button></header>
    <p class="source-note">牧場で保存済みの素材を表示します。選択だけでは所持数は減りません。</p>
    <div class="ranch-actions"><button id="ranch-connect">Googleアカウントで連携</button><button id="ranch-refresh" disabled>持ち物を再読込</button></div>
    <p id="ranch-identity"></p><p id="ranch-status" role="status" aria-live="polite"></p>
    <div id="ranch-items" aria-label="牧場の所持素材"></div>
    <footer class="source-actions"><span id="source-choice">素材を選択してください</span><button id="source-apply" disabled>この素材に設定</button></footer>
  </dialog>
</body>
</html>
