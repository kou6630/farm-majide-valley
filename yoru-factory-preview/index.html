<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14202c">
  <title>ヨルの工場 — フィールド確認</title>
  <link rel="icon" type="image/png" href="./assets/floor-light.png">

</head>
<body>
  <main id="app">
    <section id="playfield" aria-label="工場フィールド"><div id="game"></div></section>
    <header id="field-header">
      <div class="title"><small>YORU'S FACTORY</small><h1>ヨルの工場</h1></div>

        <button id="zoom-in" aria-label="拡大">＋</button>
