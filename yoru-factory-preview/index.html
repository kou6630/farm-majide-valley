<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14202c">
  <title>ヨルの工場 — フィールド確認</title>
  <link rel="icon" type="image/png" href="./assets/floor-light.png">
  <script type="module" crossorigin src="./assets/index-BKpwEj0Y.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-WmYwXkxF.css">
</head>
<body>
  <main id="app">
    <section id="playfield" aria-label="工場フィールド"><div id="game"></div></section>
    <header id="field-header">
      <div class="title"><small>YORU'S FACTORY</small><h1>ヨルの工場</h1></div>
      <div id="factory-stats" aria-label="工場の所持コインとレベル">
        <div class="factory-stat factory-money"><img src="./assets/factory-coin.png" alt="工場コイン"><strong id="factory-money">0</strong></div>
        <div class="factory-stat factory-experience"><img src="./assets/factory-xp.png" alt="経験値"><div class="experience-body"><div class="experience-label"><strong id="factory-level">Lv.1</strong><small id="factory-xp">0 / 100</small></div><progress id="factory-xp-bar" max="100" value="0" aria-label="次のレベルまでの経験値"></progress></div></div>
      </div>
      <nav class="camera-tools" aria-label="視点の操作">
        <button id="rotate-left" aria-label="左へ90度回転">↶<small>90°</small></button>
        <span id="direction" role="status" aria-live="polite">0° · 北の壁</span>
        <button id="rotate-right" aria-label="右へ90度回転">↷<small>90°</small></button>
        <button id="zoom-out" class="zoom-start" aria-label="縮小">−</button>
        <button id="zoom-in" aria-label="拡大">＋</button>
      </nav>
    </header>
    <div id="held-info" hidden><img id="held-image" alt=""><span id="held-name"></span></div>
    <button id="shop-open" type="button"><img src="./assets/belt-lv1.png" alt="">ショップ</button>
    <div id="edit-toolbar"><p id="game-status" role="status" aria-live="polite">排出口から牧場と連携して、食材を選んでください</p><p id="edit-hint" role="status" aria-live="polite" hidden></p><div class="edit-actions"><button id="belt-remove" type="button" hidden>しまう</button><button id="item-rotate" type="button" hidden disabled>↻ 90°回転</button><button id="edit-toggle" aria-pressed="false">エディットモード</button></div></div>
    <footer id="field-footer"><span id="field-size"></span><button id="outlet-summary" type="button" title="排出口の設定">排出口 / まな板台 / 倉庫 / 注文板</button></footer>
  </main>
  <dialog id="source-dialog" aria-labelledby="source-title">
    <header class="source-heading"><div><small>排出口の設定</small><h2 id="source-title">ケイオー牧場の持ち物</h2></div><button id="source-close" aria-label="閉じる">×</button></header>
    <p class="source-note">取り出した分だけ牧場の持ち物が減ります。口の手前にベルトを置くと自動で運びます。ベルトがない時や詰まっている時は、口に留まります。</p>
    <div class="ranch-actions"><button id="ranch-connect">Googleアカウントで連携</button><button id="ranch-refresh" disabled>持ち物を再読込</button></div>
    <p id="ranch-identity"></p><p id="ranch-status" role="status" aria-live="polite"></p>
    <div id="ranch-items" aria-label="牧場の所持素材"></div>
    <div class="outlet-controls"><label><input id="outlet-active" type="checkbox" checked> 自動排出</label><label>加工品の在庫上限 <input id="outlet-limit" type="number" min="1" max="100" value="10"></label></div>
    <footer class="source-actions"><span id="source-choice">素材を選択してください</span><button id="source-apply" disabled>この素材に設定</button></footer>
  </dialog>
  <dialog id="facility-dialog" aria-labelledby="facility-title">
    <header class="source-heading"><div><small id="facility-label"></small><h2 id="facility-title"></h2></div><button id="facility-close" aria-label="閉じる">×</button></header>
    <section id="warehouse-panel" hidden></section>
    <section id="orders-panel" hidden><div id="order-slots" aria-label="注文一覧"></div><div id="order-details" hidden></div></section>
  </dialog>
  <dialog id="factory-levelup" aria-labelledby="levelup-title">
    <div id="levelup-confetti" aria-hidden="true"></div><div class="levelup-rays" aria-hidden="true"></div>
    <div class="levelup-content"><img class="levelup-star" src="./assets/factory-xp.png" alt=""><h2 id="levelup-title">レベルアップ！</h2><p class="levelup-level">Lv.<strong id="levelup-number">2</strong></p>
      <div id="levelup-unlock"><img src="./assets/belt-lv1.png" alt="ベルトコンベアLv1"><div><strong>ベルトコンベアLv1</strong><small>ショップで購入できるようになりました</small></div></div>
      <button id="levelup-continue" type="button">続ける</button>
    </div>
  </dialog>
  <dialog id="shop-dialog" aria-labelledby="shop-title">
    <header class="source-heading"><div><small>工場の設備</small><h2 id="shop-title">ショップ</h2></div><button id="shop-close" aria-label="閉じる">×</button></header>
    <article class="belt-product"><img src="./assets/belt-lv1.png" alt="ベルトコンベアLv1"><div><h3>ベルトコンベアLv1</h3><p>1マスを3秒で運搬・1×1マス</p><p id="shop-level-lock">レベル2で解放</p><p id="shop-stock"></p></div></article>
    <button id="belt-buy" type="button"><img src="./assets/factory-coin.png" alt="工場コイン">100で購入して設置</button>
    <button id="belt-install" type="button" hidden>持っているコンベアを設置</button>
  </dialog>
</body>
</html>
